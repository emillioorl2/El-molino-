<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9E2B25">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Molino">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>El Molino — Finanzas personales</title>
<meta name="description" content="Registro personal de ingresos, gastos, tarjetas, deudas y suscripciones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2ECDD; --surface:#FFFDF7; --surface2:#EAE0C7; --line:#D8CBA3; --line2:#C4B587;
  --ink:#211A12; --muted:#6B5D45; --faint:#9C8E6E;
  --accent:#9E2B25; --accent-ink:#FFFFFF; --accent-soft:#F1DAD3;
  --good:#3F6B3A; --good-soft:#DEE9D6; --warn:#A3750F; --warn-soft:#F3E3C0; --bad:#7A2420; --bad-soft:#F0D9D3;
  --c1:#9E2B25; --c2:#3F6B3A; --c3:#A3750F; --c4:#5B4630;
  --shadow:0 1px 2px rgba(33,26,18,.08),0 6px 20px rgba(33,26,18,.08);
  --radius:10px;
  --sans:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141414; --surface:#1C1C1C; --surface2:#252525; --line:#363636; --line2:#454545;
    --ink:#EFEFEF; --muted:#ABABAB; --faint:#7A7A7A;
    --accent:#E2564B; --accent-ink:#141414; --accent-soft:#3A2020;
    --good:#6FA85F; --good-soft:#1E2B18; --warn:#D9A83D; --warn-soft:#332818; --bad:#E2564B; --bad-soft:#3A2020;
    --c1:#E2564B; --c2:#6FA85F; --c3:#D9A83D; --c4:#B89A6E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141414; --surface:#1C1C1C; --surface2:#252525; --line:#363636; --line2:#454545;
  --ink:#EFEFEF; --muted:#ABABAB; --faint:#7A7A7A;
  --accent:#E2564B; --accent-ink:#141414; --accent-soft:#3A2020;
  --good:#6FA85F; --good-soft:#1E2B18; --warn:#D9A83D; --warn-soft:#332818; --bad:#E2564B; --bad-soft:#3A2020;
  --c1:#E2564B; --c2:#6FA85F; --c3:#D9A83D; --c4:#B89A6E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.num,.money{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.85rem}
.pos{color:var(--good)} .neg{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.9rem}
.brand-mark svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-size:.98rem;line-height:1.1}
.brand>div span{display:block;font-size:.78rem;color:var(--muted)}
.brand .side-close{display:none;margin-left:auto}
#root{min-height:100vh}
.mbar{display:none}
.nav-scrim{display:none}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:.84rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.wrap{flex-wrap:wrap}
.per{display:flex;flex-direction:column;gap:10px}
.per-dates{gap:8px}.per-dates .inp{width:auto}
.tx-row{cursor:pointer;border-radius:8px;padding-inline:8px;margin-inline:-8px}.tx-row:hover{background:var(--surface2)}
.side-foot .seg{width:100%} .side-foot .seg button{flex:1}
.saved{font-size:.76rem;color:var(--faint);padding-left:4px}

.main{min-width:0;padding-block:24px 110px;padding-inline:clamp(16px,3vw,36px)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.page-head p{color:var(--muted);margin-top:4px;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head p{font-size:.84rem;color:var(--muted)}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:.8rem;color:var(--muted);font-weight:500}
.kpi .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.28rem;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .sub{font-size:.8rem;color:var(--muted)}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .lbl,.kpi.hero .sub{color:color-mix(in srgb,var(--bg) 72%,transparent)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plain::before{display:none}

.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.good>i{background:var(--good)} .meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
.meter .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)} .btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:500;font-size:.85rem}

.form{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:.8rem;font-weight:600;color:var(--muted)}
.fld .hint{font-size:.76rem;color:var(--faint)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:38px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.money{text-align:right}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:.82rem;font-weight:500}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:38px}
.pw-eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;border:0;background:none;border-radius:7px;color:var(--faint);cursor:pointer}
.pw-eye:hover{color:var(--ink);background:var(--surface2)}
.pw-eye svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Tables & lists */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .money{white-space:nowrap}
tfoot td{font-weight:600;border-top:1px solid var(--line2)}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .m{font-size:.8rem;color:var(--muted)}
.li .acts{display:flex;gap:2px;justify-content:flex-end}
.day-h{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:14px 2px 4px;border-bottom:1px solid var(--line)}
.dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0}
.dl>div{display:contents}
.dl dt,.dl dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0}
.dl dt{color:var(--muted)} .dl dd{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dl>div:last-child dt,.dl>div:last-child dd{border-bottom:0}
.dl .tot dt{color:var(--ink);font-weight:600} .dl .tot dd{font-weight:600}

.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:.88rem}
.hbar .bar{height:10px;border-radius:3px;background:var(--surface2);overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--c1);border-radius:3px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--faint);font-family:var(--mono);font-size:10px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:.9rem}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:var(--radius);padding:10px 14px;font-size:.88rem;font-weight:500;margin-bottom:16px}
.note{font-size:.82rem;color:var(--muted);background:var(--surface2);border-radius:8px;padding:10px 12px}

.card-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px 22px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.card-row:last-child{border-bottom:0}
.card-row .facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.82rem;color:var(--muted)}
.card-row .facts b{color:var(--ink);font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}

.light-sig{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--radius);font-weight:600}
.light-sig .dot{width:20px;height:20px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 0 5px color-mix(in srgb,currentColor 20%,transparent)}
.light-sig.good{background:var(--good-soft);color:var(--good)} .light-sig.warn{background:var(--warn-soft);color:var(--warn)} .light-sig.bad{background:var(--bad-soft);color:var(--bad)}
.light-sig small{display:block;font-weight:400;color:var(--ink);opacity:.85;margin-top:2px}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:var(--shadow);padding:12px 18px;border-radius:12px;font-weight:600}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:.88rem;z-index:60;box-shadow:var(--shadow)}

/* Onboarding */
.ob{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr);background:var(--bg)}
.ob-side{background:var(--surface);border-right:1px solid var(--line);padding:28px 22px;display:flex;flex-direction:column;gap:24px}
.ob-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ob-steps li{display:flex;gap:12px;align-items:center;padding:8px 6px;color:var(--faint);font-weight:500;font-size:.92rem}
.ob-steps li .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:.76rem;flex:none}
.ob-steps li.done{color:var(--muted)} .ob-steps li.done .n{background:var(--good-soft);border-color:transparent;color:var(--good)}
.ob-steps li.cur{color:var(--ink)} .ob-steps li.cur .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ob-main{padding-block:40px 60px;padding-inline:clamp(16px,5vw,64px);max-width:860px;width:100%}
.ob-main h1{font-size:1.9rem;margin-bottom:8px}
.split .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em;margin-bottom:-.1em}
.split .w>span{display:inline-block}
.ob-main{overflow-x:clip}
.ob-main .lead{color:var(--muted);max-width:60ch;margin-bottom:24px}
.ob-q{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.ob-q .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ob-nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.added{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.added .it{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.added .it .m{font-size:.8rem;color:var(--muted)}

.sheep-loader{display:flex;align-items:flex-end;gap:10px;height:42px;padding-bottom:8px;border-bottom:2px dashed var(--line2);width:fit-content}
.sheep-loader.sm{gap:6px;height:24px;padding-bottom:5px;border-bottom-width:1.5px}
.sheep-loader span{display:inline-block;font-size:1.7rem;line-height:1;animation:sheepJump 1.1s ease-in-out infinite}
.sheep-loader.sm span{font-size:1rem}
.sheep-loader span:nth-child(2){animation-delay:.13s}.sheep-loader span:nth-child(3){animation-delay:.26s}
.sheep-loader span:nth-child(4){animation-delay:.39s}.sheep-loader span:nth-child(5){animation-delay:.52s}
@keyframes sheepJump{0%,50%,100%{transform:translateY(0) rotate(0deg)}22%{transform:translateY(-14px) rotate(-10deg)}}
@media (prefers-reduced-motion:reduce){.sheep-loader span{animation:none}}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .mbar{display:flex;align-items:center;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mbar .brand{padding:2px 0 2px 4px}
  .menu-btn{padding:8px;border-radius:9px;flex:none}
  .menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .side{position:fixed;top:0;left:0;height:100%;width:min(280px,84vw);transform:translateX(-100%);transition:transform .22s cubic-bezier(.32,.72,.35,1);z-index:40;box-shadow:var(--shadow);border-right:1px solid var(--line)}
  .side.open{transform:translateX(0)}
  .brand .side-close{display:inline-flex}
  .side-foot{display:flex}
  .nav-scrim{display:block;position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:39}
  .card-row{grid-template-columns:minmax(0,1fr)}
  .ob{grid-template-columns:minmax(0,1fr)}
  .ob-side{padding:16px;border-right:0;border-bottom:1px solid var(--line)}
  .ob-steps{flex-direction:row;overflow-x:auto}
  .ob-steps li span.t{display:none}
  .hbar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:no-preference){
  .ob-main.enter>*{animation:obIn .55s cubic-bezier(.2,.75,.25,1) both}
  .ob-main.enter>*:nth-child(2){animation-delay:.08s} .ob-main.enter>*:nth-child(3){animation-delay:.15s}
  .ob-main.enter>*:nth-child(4){animation-delay:.21s} .ob-main.enter>*:nth-child(5){animation-delay:.27s} .ob-main.enter>*:nth-child(n+6){animation-delay:.32s}
  .ob-main.enter>.split{animation:none}
  .ob-main.enter .split .w>span{animation:wordUp .65s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i) * 55ms)}
  .ob-main.leave>*{animation:obOut .26s cubic-bezier(.5,0,.75,.2) both}
  .ob-main.leave>*:nth-child(2){animation-delay:.03s} .ob-main.leave>*:nth-child(n+3){animation-delay:.06s}
  .ob-steps li.cur .n{animation:stepPop .45s cubic-bezier(.3,1.6,.5,1) both}
  .app.fade-in .main>*{animation:obIn .5s cubic-bezier(.2,.75,.25,1) both;--dx:0px}

<script>
(function(){

const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const fDate=(s,yr)=>{if(!s)return'—';const d=parse(s);return `${d.getDate()} ${MES[d.getMonth()]}`+(yr?` ${d.getFullYear()}`:'')};

const MXN=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
const MXN0=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const money=n=>MXN.format(Math.round((+n||0)*100)/100);
const money0=n=>MXN0.format(+n||0);
const pct=(n,d=1)=>`${((+n||0)*100).toFixed(d)}%`;
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)?n:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const sum=(arr,f=x=>x)=>arr.reduce((a,x)=>a+(+f(x)||0),0);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const M=n=>`<span class="money">${money(n)}</span>`;
const Ms=(n)=>`<span class="money ${n<0?'neg':n>0?'pos':''}">${money(n)}</span>`;

/* ---------- Estado ---------- */
const DEFAULT_CATS=[
  ['Comida','Gasto','Variable'],['Transporte','Gasto','Variable'],['Ocio','Gasto','Variable'],['Salud','Gasto','Variable'],
  ['Escuela','Gasto','Variable'],['Ropa y personal','Gasto','Variable'],['Hogar','Gasto','Variable'],['Otros gastos','Gasto','Variable'],
  ['Suscripciones','Gasto','Fijo'],['Renta y servicios','Gasto','Fijo'],['Gasolina','Gasto','Neutral'],['Pago de tarjetas','Gasto','Deuda'],
  ['Pago de préstamo','Gasto','Deuda'],['Ahorro / colchón','Gasto','Ahorro'],
  ['Préstamos a terceros','Gasto','Prestado'],['Cobro de préstamo','Ingreso','Prestado'],
  ['Depósito a caja de ahorro','Gasto','Ahorro'],['Retiro de caja de ahorro','Ingreso','Ahorro'],
  ['Sueldo','Ingreso','Ingreso'],['Ingresos extra','Ingreso','Ingreso'],['Apoyo gasolina','Ingreso','Neutral'],['Otros ingresos','Ingreso','Ingreso']
].map(([name,type,group])=>({name,type,group}));
const GROUPS={Variable:'Gasto del día a día',Fijo:'Fijos y suscripciones',Deuda:'Pago de deudas',Neutral:'Neutral (entra y sale)',Ahorro:'Ahorro',Ingreso:'Ingreso',Prestado:'Préstamos a terceros'};
function blank(){return{v:1,setupDone:false,example:false,
  settings:{name:'',startDate:today(),initialBalance:0,incomeAmount:0,incomeFreq:'semanal',extraFreq:'semanal',extraMin:0,extraMax:0,dailyGoal:0,emergency:0,utilWarn:.30,utilCrit:.70,redPct:.50},
  categories:DEFAULT_CATS.map(c=>({...c})),cards:[],loans:[],subs:[],txs:[],paid:{},lent:[],savings:[]}}
function ensureCoreCats(target){const st=target||S;const names=st.categories.map(c=>c.name);for(const c of DEFAULT_CATS){if((c.group==='Prestado'||c.group==='Ahorro')&&!names.includes(c.name))st.categories.push({...c})}}
function migrateSettings(raw){if(!raw)return raw;
  if(('extraPerDay' in raw||'extraDays' in raw)&&!('extraMin' in raw)){const wk=Math.round((+raw.extraPerDay||0)*(+raw.extraDays||0)*100)/100;raw.extraFreq='semanal';raw.extraMin=wk;raw.extraMax=wk}
  delete raw.extraPerDay;delete raw.extraDays;return raw}
let S=blank();
let saveMsg='';
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.settings){migrateSettings(d.settings);S=Object.assign(blank(),d);S.settings=Object.assign(blank().settings,d.settings);}}}catch(e){}ensureCoreCats()}
let saveT;
function save(){if(S.example)return;if(U.acct){cacheLocal();cloudPushSoon();return}clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));saveMsg='Guardado en este navegador';}catch(e){saveMsg='No se pudo guardar en este navegador. Exporta un respaldo.'}const el=document.getElementById('savedMsg');if(el)el.textContent=saveMsg},250)}
let P={theme:'system',charts:{}};
function loadPrefs(){try{const r=localStorage.getItem(PREF);if(r)P=Object.assign(P,JSON.parse(r))}catch(e){}}
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify(P))}catch(e){}}
function applyTheme(){const r=document.documentElement;if(P.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',P.theme)}

/* ---------- Catálogos ---------- */
const cat=name=>S.categories.find(c=>c.name===name);
const groupOf=t=>{const c=cat(t.cat);return c?c.group:(t.type==='Ingreso'?'Ingreso':'Variable')};
function methods(){return[{id:'Efectivo',name:'Efectivo',cash:true},{id:'Débito',name:'Débito / banco',cash:true},...S.cards.map(c=>({id:'card:'+c.id,name:c.name,cash:false,card:c}))]}
const methodName=id=>{if(!id)return'—';if(id.startsWith('card:')){const c=S.cards.find(c=>'card:'+c.id===id);return c?c.name:'Tarjeta eliminada'}return id==='Débito'?'Débito / banco':id};
const isCash=id=>!String(id||'').startsWith('card:');

/* ---------- Ingresos y metas ---------- */
const FREQ_W={semanal:1,quincenal:24/52,mensual:12/52};
function expectedWeekly(){const s=S.settings;return (s.incomeAmount||0)*(FREQ_W[s.incomeFreq]||1)+(+s.extraMin||0)*(FREQ_W[s.extraFreq]||1)}
const weeklyGoal=()=>(S.settings.dailyGoal||0)*7;
const monthlyGoal=()=>(S.settings.dailyGoal||0)*30;
const weeklyAvail=()=>expectedWeekly()-weeklyGoal();

/* ---------- Movimientos ---------- */
const txIn=(a,b)=>S.txs.filter(t=>t.date>=a&&t.date<=b);
function stats(list){
  const r={income:0,personal:0,fijos:0,deuda:0,neutral:0,ahorro:0,gastos:0,count:list.length};
  for(const t of list){const g=groupOf(t),a=+t.amount||0;
    if(t.type==='Ingreso'){if(g==='Ingreso')r.income+=a;continue}
    r.gastos+=a;
    if(g==='Variable')r.personal+=a;else if(g==='Fijo')r.fijos+=a;else if(g==='Deuda')r.deuda+=a;else if(g==='Neutral')r.neutral+=a;else if(g==='Ahorro')r.ahorro+=a;}
  r.balance=r.income-r.personal-r.fijos-r.deuda;return r}
function cashNow(upTo){const s=S.settings;upTo=upTo||'9999-12-31';let c=+s.initialBalance||0;
  for(const t of S.txs){if(t.date<s.startDate||t.date>upTo)continue;if(t.type==='Ingreso')c+=+t.amount||0;else if(isCash(t.method))c-=+t.amount||0}
  c+=sum(S.savings,j=>j.spendable?jarStats(j).balance:0);
  return c}

/* ---------- Tarjetas ---------- */
function cardStats(c){
  const since=c.baseDate||S.settings.startDate, mid='card:'+c.id;
  const buys=S.txs.filter(t=>t.type==='Gasto'&&t.method===mid&&t.date>=since&&groupOf(t)!=='Deuda');
  const pays=S.txs.filter(t=>t.type==='Gasto'&&groupOf(t)==='Deuda'&&t.target===c.id&&t.date>=since);
  const buySum=sum(buys,t=>t.amount), paySum=sum(pays,t=>t.amount);
  const used=Math.max(0,(+c.balance||0)+buySum-paySum);
  const msiMonthly=sum(buys.filter(t=>t.msi>1),t=>t.amount/t.msi);
  const nonMsi=sum(buys.filter(t=>!(t.msi>1)),t=>t.amount);
  const baseNoInt=(c.noInt==null||c.noInt==='')?(+c.balance||0):+c.noInt;
  const noInt=clamp(baseNoInt+nonMsi+msiMonthly-paySum,0,used);
  const limit=+c.limit||0, avail=limit-used, util=limit>0?used/limit:0;
  const t=today(), nextCut=nextOcc(c.cutAnchor,c.cutDay), nextDue=nextOcc(c.dueAnchor,c.dueDay);
  const lvl=util>=S.settings.utilCrit?'bad':util>=S.settings.utilWarn?'warn':'good';
  const subsMonthly=sum(S.subs.filter(s=>s.method===mid),s=>s.amount);
  return{used,avail,util,limit,noInt,msiMonthly,subsMonthly,nextCut,nextDue,daysToPay:daysBetween(t,nextDue),lvl,buys,pays}}
function nextOcc(anchor,day){const t=today();return anchor&&anchor>=t?anchor:nextDayOfMonth(t,+day||1)}
function cardTotals(){const st=S.cards.map(cardStats);const used=sum(st,s=>s.used),limit=sum(st,s=>s.limit);return{used,limit,avail:limit-used,util:limit>0?used/limit:0,noInt:sum(st,s=>s.noInt)}}
function dueAfterPurchase(c,date){ // fecha en que pagarías una compra hecha en `date`
  const cut=nextDayOfMonth(date,+c.cutDay||1);return nextDayOfMonth(cut,+c.dueDay||1,true)}

/* ---------- Préstamos ---------- */
const FREQ_L={semanal:'semanal',quincenal:'quincenal',mensual:'mensual'};
function stepDate(s,freq){if(freq==='semanal')return addDays(s,7);if(freq==='mensual')return addMonths(s,1);
  const d=parse(s);if(d.getDate()<15)return toStr(new Date(d.getFullYear(),d.getMonth(),15));
  if(d.getDate()<lastDay(d.getFullYear(),d.getMonth())&&d.getDate()<30)return toStr(new Date(d.getFullYear(),d.getMonth(),Math.min(30,lastDay(d.getFullYear(),d.getMonth()))));
  return toStr(new Date(d.getFullYear(),d.getMonth()+1,15))}
function impliedRate(P0,pay,n){if(!(P0>0&&pay>0&&n>0)||pay*n<=P0)return 0;let lo=0,hi=1;for(let i=0;i<80;i++){const r=(lo+hi)/2;const p=P0*r/(1-Math.pow(1+r,-n));if(p>pay)hi=r;else lo=r}return(lo+hi)/2}
function loanStats(l){
  const pays=S.txs.filter(t=>t.type==='Gasto'&&t.target===l.id&&groupOf(t)==='Deuda');
  const cuotasReg=pays.filter(t=>t.loanKind!=='abono').length, abonos=sum(pays.filter(t=>t.loanKind==='abono'),t=>t.amount);
  const n=+l.n||0, pay=+l.payment||0, paid=Math.min(n,(+l.paidInit||0)+cuotasReg), left=Math.max(0,n-paid);
  const r=impliedRate(+l.original||0,pay,n);

  const capital=Math.max(0,(l.capital!=null&&l.capital!==''&&cuotasReg===0&&abonos===0)?+l.capital:pv-abonos);
  const total=pay*n, interest=Math.max(0,total-(+l.original||0));
  const pendingN=Math.max(0,n-(+l.paidInit||0));
  const sched=[];let d=l.nextDate||today();for(let i=0;i<pendingN;i++){sched.push(d);d=stepDate(d,l.freq)}
  const next=sched[cuotasReg]||null;
  return{paid,left,rate:r,capital,total,interest,interestPct:(+l.original>0)?interest/l.original:0,remainingPay:pay*left,next,sched,cuotasReg,abonos,done:left===0}}
const loanTotals=()=>sum(S.loans,l=>loanStats(l).capital);

/* ---------- Préstamos a terceros (me deben) ---------- */
function lentStats(l){
  const cobros=S.txs.filter(t=>t.type==='Ingreso'&&t.target===l.id&&groupOf(t)==='Prestado');
  const received=sum(cobros,t=>t.amount);
  const outstanding=Math.max(0,(+l.amount||0)-received);
  const done=outstanding<=0.004;
  let nextDue=l.dueDate||null;
  if(l.installments&&l.instFreq){let d=l.dueDate||l.dateGiven||today();for(let i=0;i<cobros.length;i++)d=stepDate(d,l.instFreq);nextDue=d}
  const overdue=!done&&nextDue&&nextDue<today();
  const remindDue=!!(l.remind&&l.reminderDate&&l.reminderDate<=today()&&!done);
  return{received,outstanding,done,nextDue,overdue,remindDue,cobros,count:cobros.length}}
const lentTotals=()=>sum(S.lent,l=>lentStats(l).outstanding);

/* ---------- Cajas de ahorro ---------- */
function jarStats(j){
  const rate=+j.rate||0,dr=rate>0?Math.pow(1+rate,1/365)-1:0;
  const events=S.txs.filter(t=>t.target===j.id&&(t.cat==='Depósito a caja de ahorro'||t.cat==='Retiro de caja de ahorro'))
    .map(t=>({date:t.date,amt:t.type==='Gasto'?(+t.amount||0):-(+t.amount||0)})).sort((a,b)=>a.date.localeCompare(b.date));
  let bal=Math.max(0,+j.startAmount||0),cur=j.createdDate||(events[0]?events[0].date:today());
  for(const e of events){const days=Math.max(0,daysBetween(cur,e.date));if(days>0&&dr>0)bal=bal*Math.pow(1+dr,days);bal=Math.max(0,bal+e.amt);cur=e.date}
  const daysLeft=Math.max(0,daysBetween(cur,today()));if(daysLeft>0&&dr>0)bal=bal*Math.pow(1+dr,daysLeft);
  const principal=Math.max(0,(+j.startAmount||0)+sum(events,e=>e.amt));
  const dep=sum(events.filter(e=>e.amt>0),e=>e.amt),wd=sum(events.filter(e=>e.amt<0),e=>-e.amt);
  return{balance:Math.max(0,bal),principal,interestEarned:Math.max(0,bal-principal),dep,wd}}
const savingsTotal=onlyVisible=>sum(S.savings,j=>(!onlyVisible||j.visible!==false)?jarStats(j).balance:0);
function compoundSim(z,rate){
  const P0=+z.amount||0,months=Math.max(0,Math.round(+z.months||0)),freq=z.freq||'mensual',contribIn=+z.contrib||0;
  const ok=P0>0&&months>0;
  const perYear=freq==='semanal'?52:12;
  const nPeriods=freq==='semanal'?Math.round(months*52/12):months;
  const i=(rate||0)/perYear,C=freq==='unico'?0:contribIn;
  let fv=P0,lin=P0;const pts=[{k:0,fv,lin}];const step=Math.max(1,Math.ceil(nPeriods/10));
  for(let k=1;k<=nPeriods;k++){fv=fv*(1+i)+C;lin=lin+C;if(k%step===0||k===nPeriods)pts.push({k,fv,lin})}
  const noCompound=P0+C*nPeriods,growth=fv-noCompound;
  return{ok,P0,months,nPeriods,freq,contrib:C,fv,noCompound,growth,pts}}

/* ---------- Plan de pagos ---------- */
const WEEKS=12;
function planItems(){
  const t=today(), start=weekStart(t), end=addDays(start,WEEKS*7-1), items=[];
  for(const c of S.cards){const st=cardStats(c);let d=st.nextDue,first=true;
    while(d<=end){const key=`card:${c.id}:${d}`;const pd=S.paid[key];
      const amt=pd?pd.amount:(first?st.noInt:st.subsMonthly+st.msiMonthly);
      if(amt>0.004||pd)items.push({key,kind:'card',ref:c.id,date:d,name:c.name,type:'Tarjeta',amount:amt,paid:!!pd});
      first=false;d=nextDayOfMonth(d,+c.dueDay||1,true)}}
  for(const l of S.loans){const st=loanStats(l);st.sched.forEach((d,i)=>{if(d<start||d>end)return;
    items.push({key:`loan:${l.id}:${i}`,kind:'loan',ref:l.id,idx:i,date:d,name:`${l.name} · cuota ${(+l.paidInit||0)+i+1} de ${l.n}`,type:'Préstamo',amount:+l.payment||0,paid:i<st.cuotasReg})})}
  for(const s of S.subs){if(!isCash(s.method))continue;let d=nextDayOfMonth(start,+s.day||1);
    while(d<=end){const key=`sub:${s.id}:${d}`;items.push({key,kind:'sub',ref:s.id,date:d,name:s.name,type:'Fijo',amount:+s.amount||0,paid:!!S.paid[key]});d=nextDayOfMonth(d,+s.day||1,true)}}
  const em=+S.settings.emergency||0;if(em>0){const key='colchon';const pd=S.paid[key];const saved=sum(S.txs.filter(x=>groupOf(x)==='Ahorro'),x=>x.amount);
    const rem=pd?pd.amount:Math.max(0,em-saved);if(rem>0||pd)items.push({key,kind:'colchon',date:pd?pd.date:weekEnd(t),name:'Apartar colchón de emergencia',type:'Ahorro',amount:rem,paid:!!pd})}
  return items.sort((a,b)=>a.date.localeCompare(b.date))}
function planWeeks(items){items=items||planItems();const start=weekStart(today()),wa=weeklyAvail();let prev=null;const out=[];
  for(let i=0;i<WEEKS;i++){const ws=addDays(start,i*7),we=addDays(ws,6);const its=items.filter(x=>x.date>=ws&&x.date<=we);
    const pending=sum(its.filter(x=>!x.paid),x=>x.amount);const disp=i===0?cashNow():prev+wa;const sobra=disp-pending;
    out.push({ws,we,items:its,pending,byType:{Tarjeta:sum(its.filter(x=>!x.paid&&x.type==='Tarjeta'),x=>x.amount),Préstamo:sum(its.filter(x=>!x.paid&&x.type==='Préstamo'),x=>x.amount),Otros:sum(its.filter(x=>!x.paid&&(x.type==='Fijo'||x.type==='Ahorro')),x=>x.amount)},disp,sobra});prev=sobra}
  return out}

/* ---------- Gráficas (SVG) ---------- */
function nice(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function barChart({labels,series,goal,goalLabel,h=210,every,w=640}){
  const W=w,H=h,L=62,R=10,T=12,B=26,pw=W-L-R,ph=H-T-B;
  const all=series.flatMap(s=>s.values).concat(goal!=null?[goal]:[]);
  let mx=Math.max(0,...all),mn=Math.min(0,...all);
  const step=nice((mx-mn)/4||1);mx=Math.ceil(mx/step)*step||step;mn=Math.floor(mn/step)*step;
  const y=v=>T+ph-(v-mn)/(mx-mn)*ph;
  const gw=pw/labels.length,bw=Math.min(28,gw*.74/series.length);
  every=every||Math.ceil(labels.length/12);
  let g='';
  for(let v=mn;v<=mx+1e-9;v+=step){g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${money0(v)}</text>`}
  labels.forEach((lb,i)=>{const gx=L+gw*i+gw/2,x0=gx-bw*series.length/2;

      g+=`<rect x="${x0+j*bw+.5}" y="${y1}" width="${Math.max(1,bw-1)}" height="${hh}" rx="2" style="fill:${v<0?'var(--bad)':s.color}"><title>${esc(lb)} · ${esc(s.name)}: ${money(v)}</title></rect>`});

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend">${leg}</div>`}
function hbars(rows,{color='var(--c1)',fmt=money}={}){const mx=Math.max(...rows.map(r=>r.value),0)||1;

function field(f,v,pre='f_'){const id=pre+f.k;const val=v==null?'':v;const req=f.req?' required':'';let inp;
  switch(f.t){
    case'money':inp=`<input class="inp money" id="${id}" name="${f.k}" type="number" step="0.01" min="0" inputmode="decimal" placeholder="${esc(f.ph||'0.00')}" value="${esc(val)}"${req}>`;break;
    case'number':inp=`<input class="inp num" id="${id}" name="${f.k}" type="number" step="${f.step||1}" min="${f.min??0}" ${f.max!=null?`max="${f.max}"`:''} inputmode="decimal" placeholder="${esc(f.ph||'')}" value="${esc(val)}"${req}>`;break;
    case'day':inp=`<input class="inp num" id="${id}" name="${f.k}" type="number" min="1" max="31" inputmode="numeric" placeholder="1–31" value="${esc(val)}"${req}>`;break;
    case'date':inp=`<input class="inp" id="${id}" name="${f.k}" type="date" value="${esc(val)}"${req}>`;break;
    case'select':inp=`<select class="inp" id="${id}" name="${f.k}"${f.ch?` data-ch="${f.ch}"`:''}>${f.opts.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}"${String(a)===String(val)?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;break;
    case'check':return `<div class="fld ${f.wide?'wide':''}"><label class="chk"><input type="checkbox" id="${id}" name="${f.k}"${val?' checked':''}${f.ch?` data-ch="${f.ch}"`:''}> ${esc(f.l)}</label>${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
    default:inp=`<input class="inp" id="${id}" name="${f.k}" type="text" placeholder="${esc(f.ph||'')}" value="${esc(val)}" autocomplete="off"${req}>`}
  return `<div class="fld ${f.wide?'wide':''}"><label for="${id}">${esc(f.l)}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`}

function readForm(root,fields,pre='f_'){const o={},errs=[];for(const f of fields){const el=root.querySelector('#'+CSS.escape(pre+f.k));if(!el)continue;let v;

function txMeta(t){const extra=[t.cat,methodName(t.method)];if(t.msi>1)extra.push(`${t.msi} MSI · ${money(t.amount/t.msi)}/mes`);
  if(t.target){const c=S.cards.find(c=>c.id===t.target),l=S.loans.find(l=>l.id===t.target),p=S.lent.find(p=>p.id===t.target),j=S.savings.find(j=>j.id===t.target);
   if(c)extra.push('a '+c.name);if(l)extra.push((t.loanKind==='abono'?'abono a ':'cuota de ')+l.name);if(p)extra.push((t.type==='Ingreso'?'cobro a ':'préstamo a ')+p.name);if(j)extra.push((t.type==='Ingreso'?'retiro de ':'depósito a ')+j.name)}return extra}

  const days=nd<=62?[...Array(nd)].map((_,i)=>{const d=addDays(a,i),l=list.filter(t=>t.date===d);return{d,inc:sum(l.filter(t=>t.type==='Ingreso'),t=>t.amount),gas:sum(l.filter(t=>t.type==='Gasto'),t=>t.amount),n:l.length}}):null;

    <div class="fld"><label for="exC">Categoría</label>${sel('exC',['Todas',...S.categories.map(c=>c.name)],e.cat)}</div>
    <div class="fld"><label for="exMe">Método de pago</label>${sel('exMe',[['Todos','Todos'],...methods().map(m=>[m.id,m.name])],e.method)}</div>
   </div></div>
   <div class="kpis">
    ${kpi('Balance',Ms(st.balance),'Ingresos − gastos','hero')}${kpi('Ingresos',M(st.income))}${kpi('Gastos',M(st.gastos),'Todos, incluye deudas y neutrales')}
    <div class="kpi"><span class="lbl">Gasto personal</span><span class="val">${money(st.personal)}</span><span class="sub row" style="justify-content:space-between">Meta ${money0(goal)} ${goalChip(st.personal,goal)}</span></div>
    ${kpi('Promedio por día',M(st.personal/nd),'Gasto personal')}${kpi('Movimientos',`<span class="num">${st.count}</span>`,`${daysWith} días con movimientos`)}
   </div>
   ${P.charts.explorar&&days&&nd>1?`<div class="panel"><div class="panel-head"><h2>Por día</h2></div>${barChart({labels:days.map(x=>String(parse(x.d).getDate())),series:[{name:'Ingresos',color:'var(--c2)',values:days.map(x=>x.inc)},{name:'Gastos',color:'var(--c1)',values:days.map(x=>x.gas)}]})}</div>`:''}
   <div class="grid g2">
    <div class="panel"><div class="panel-head"><h2>Del ingreso al balance</h2><p>Sin gasolina ni ahorro (neutrales)</p></div>
     ${funnel.map(([n,v,c])=>`<div class="hbar"><span class="nm">${n}</span><span class="bar"><i style="width:${(Math.abs(v)/fmax*100).toFixed(1)}%;background:${c}"></i></span><span class="money">${v<0?'−':''}${money(Math.abs(v))}</span></div>`).join('')}
     <div class="hbar" style="border-top:1px solid var(--line);margin-top:6px;padding-top:9px"><b class="nm">Balance</b><span></span>${Ms(st.balance)}</div></div>
    <div class="panel"><div class="panel-head"><h2>Por categoría</h2></div>${byCat.length?`<div class="tbl-wrap"><table><thead><tr><th>Categoría</th><th class="r">Monto</th><th class="r">Mov.</th></tr></thead><tbody>${byCat.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${M(x.value)}</td><td class="r num">${x.n}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Sin movimientos.</div>`}</div>
   </div>
   ${days&&nd>1?`<div class="panel"><div class="panel-head"><h2>Por día</h2></div><div class="tbl-wrap"><table><thead><tr><th>Día</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Mov.</th></tr></thead><tbody>${days.map(x=>`<tr${x.n?'':' class="faint"'}><td>${fDay(x.d)}</td><td class="r">${M(x.inc)}</td><td class="r">${M(x.gas)}</td><td class="r num">${x.n}</td></tr>`).join('')}</tbody></table></div></div>`:''}
   <div class="panel"><div class="panel-head"><h2>Detalle</h2><p>Toca “Editar” para corregir un movimiento</p></div>${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th class="r">Monto</th><th>Método</th><th></th></tr></thead><tbody>${list.slice().sort((x,y)=>x.date.localeCompare(y.date)).map(t=>`<tr><td>${fDate(t.date)}</td><td>${t.type}</td><td>${esc(t.cat)}</td><td>${esc(t.desc)}</td><td class="r">${M(t.amount)}</td><td>${esc(methodName(t.method))}</td><td class="r"><button class="btn sm" data-a="editTx" data-id="${t.id}">${icon('edit')}Editar</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No hay movimientos con estos filtros.</div>`}</div>

/* ---------- Balance real ---------- */
function tabBalance(){
  const s=S.settings,st=S.txs.filter(t=>t.date>=s.startDate);
  const inc=sum(st.filter(t=>t.type==='Ingreso'),t=>t.amount),gas=st.filter(t=>t.type==='Gasto');
  const ahorro=sum(gas.filter(t=>groupOf(t)==='Ahorro'),t=>t.amount),cashOut=sum(gas.filter(t=>isCash(t.method)&&!['Deuda','Ahorro'].includes(groupOf(t))),t=>t.amount),payCards=sum(gas.filter(t=>isCash(t.method)&&t.cat==='Pago de tarjetas'),t=>t.amount),
    payLoans=sum(gas.filter(t=>isCash(t.method)&&groupOf(t)==='Deuda'&&t.cat!=='Pago de tarjetas'),t=>t.amount),cardBuys=sum(gas.filter(t=>!isCash(t.method)),t=>t.amount);
  const cash=cashNow(),ct=cardTotals(),lt=loanTotals(),spendableTotal=sum(S.savings,j=>j.spendable?jarStats(j).balance:0);
  const savVis=sum(S.savings,j=>(j.visible!==false&&!j.spendable)?jarStats(j).balance:0);
  const debts=ct.used+lt,net=cash+ahorro+savVis-debts;
  const receivable=lentTotals();
  const weeks=[...Array(8)].map((_,i)=>{const e=addDays(weekEnd(today()),-7*(7-i));return{e,c:cashNow(e)}});
  const mx=Math.max(cash+ahorro+savVis,ct.used,lt,1);
  return `<div class="page-head"><div><h1>Balance real</h1><p>Cuánto has ganado, cuánto has gastado y cuánto es realmente tuyo descontando lo que debes.</p></div></div>
  <div class="stack">
   <div class="kpis">${kpi('Balance real (lo que tienes − lo que debes)',Ms(net),net<0?'Debes más de lo que tienes hoy':'Tienes más de lo que debes','hero')}${kpi('Efectivo disponible',Ms(cash),spendableTotal>0?`Incluye ${money(spendableTotal)} de cajas disponibles para gastos`:(ahorro?`Más ${money(ahorro)} en tu colchón`:'En mano o en el banco'))}${kpi('Total de deudas',M(debts),'Tarjetas + préstamos')}${S.savings.length?kpi('En cajas de ahorro',M(savingsTotal()),'Suma de todas tus cajas'):''}</div>
   ${receivable>0?`<p class="small" style="color:var(--warn);margin:-8px 0 4px">Te deben: ${money(receivable)} <span class="muted">(no cuenta como dinero disponible)</span></p>`:''}
   <div class="panel"><div class="panel-head"><h2>Lo que tienes contra lo que debes</h2></div>
    <div class="hbar"><span class="nm">Tienes</span><span class="bar" style="height:16px"><i style="width:${(Math.max(cash+ahorro+savVis,0)/mx*100).toFixed(1)}%;background:var(--good)"></i></span>${M(cash+ahorro+savVis)}</div>
    <div class="hbar"><span class="nm">Debes en tarjetas</span><span class="bar" style="height:16px"><i style="width:${(ct.used/mx*100).toFixed(1)}%;background:var(--c4)"></i></span>${M(ct.used)}</div>
    <div class="hbar"><span class="nm">Debes en préstamos</span><span class="bar" style="height:16px"><i style="width:${(lt/mx*100).toFixed(1)}%;background:var(--c3)"></i></span>${M(lt)}</div></div>
   <div class="grid g2">
    <div class="panel"><h2 style="margin-bottom:10px">Cómo se calcula</h2><dl class="dl">
     <div><dt>Saldo inicial (${fDate(s.startDate,1)})</dt><dd>${money(s.initialBalance)}</dd></div>
     <div><dt>+ Ingresos registrados</dt><dd>${money(inc)}</dd></div>
     <div><dt>− Gastos en efectivo o débito</dt><dd>${money(cashOut)}</dd></div>
     <div><dt>− Pagos a tarjetas</dt><dd>${money(payCards)}</dd></div>
     <div><dt>− Pagos a préstamos</dt><dd>${money(payLoans)}</dd></div>
     <div><dt>− Apartado al colchón y cajas de ahorro</dt><dd>${money(ahorro)}</dd></div>
     ${spendableTotal>0?`<div><dt>+ Cajas de ahorro disponibles para gastos</dt><dd>${money(spendableTotal)}</dd></div>`:''}
     <div class="tot"><dt>= Efectivo disponible</dt><dd>${money(cash)}</dd></div>
     <div><dt>Compras con tarjeta (suben tu deuda, no tocan tu efectivo)</dt><dd>${money(cardBuys)}</dd></div>
     ${ahorro?`<div><dt>+ Colchón apartado (sigue siendo tuyo)</dt><dd>${money(ahorro)}</dd></div>`:''}
     ${savVis>0?`<div><dt>+ ${spendableTotal>0?'Otras cajas':'Cajas'} de ahorro visibles en tu balance</dt><dd>${money(savVis)}</dd></div>`:''}
     <div><dt>− Tarjetas de crédito (saldo usado)</dt><dd>${money(ct.used)}</dd></div>
     <div><dt>− Préstamos (capital pendiente)</dt><dd>${money(lt)}</dd></div>
     <div class="tot"><dt>= Balance real</dt><dd class="${net<0?'neg':'pos'}">${money(net)}</dd></div></dl></div>
    <div class="panel"><div class="panel-head"><h2>Efectivo al cierre de cada semana</h2></div>${barChart({labels:weeks.map(x=>fDate(x.e)),series:[{name:'Efectivo disponible',color:'var(--c2)',values:weeks.map(x=>x.c)}],every:2,h:240,w:420})}</div>
   </div>
   <p class="note">Registra tus compras con tarjeta usando esa tarjeta como método, y cuando pagues una tarjeta anótalo con la categoría “Pago de tarjetas”. Así el balance no cuenta el mismo dinero dos veces. Las cajas “disponibles para gastos” cuentan como efectivo; las demás cajas ocultas no se suman aquí.</p>
  </div>`}

function simulateLoan(){
  const z=U.simLoan,P0=+z.amount||0,n=Math.max(0,Math.round(+z.n||0)),pay=+z.payment||0,freq=z.freq;
  const ok=P0>0&&n>0&&pay>0;
  const total=pay*n,interest=Math.max(0,total-P0),interestPct=P0>0?interest/P0:0,perPeriodInterest=n>0?interest/n:0;
  const rate=ok?impliedRate(P0,pay,n):0;
  const wCost=pay*(FREQ_W[freq]||1),wAvail=weeklyAvail(),wFree=wAvail-wCost,cushion=+S.settings.emergency||0;
  let lvl=0,why='Te alcanza sin apretar tu semana ni tocar tu colchón.';
  if(ok){
    if(wFree>=0){lvl=0;why=`Después de este pago te quedarían ${money(wFree)} libres cada semana.`}
    else if(-wFree<=cushion){lvl=1;why=`Te faltarían ${money(-wFree)} cada semana: tendrías que recortar gastos o usar tu colchón.`}
    else{lvl=2;why=`Te faltarían ${money(-wFree)} cada semana y tu colchón (${money(cushion)}) no alcanzaría para cubrirlo.`}}
  return{P0,n,pay,freq,ok,total,interest,interestPct,perPeriodInterest,rate,wCost,wAvail,wFree,cushion,lvl,why}}

/* ---------- Simulador ---------- */
function simulate(){
  const z=U.sim,amt=+z.amount||0,s=S.settings,card=S.cards.find(c=>c.id===z.card);
  const mode=(z.mode!=='efectivo'&&!card)?'efectivo':z.mode;
  const months=mode==='msi'?Math.max(2,+z.months||2):1;
  const impact=mode==='msi'?amt/months:amt;
  const outDate=mode==='efectivo'?z.date:dueAfterPurchase(card,z.date);
  const weeks=planWeeks(),w=weeks.find(x=>outDate>=x.ws&&outDate<=x.we);
  const libre=w?w.sobra:weeklyAvail();
  const covered=clamp(impact,0,Math.max(0,libre)),uncovered=impact-covered;
  const cushion=+s.emergency||0;
  let lvl=0,why='Se cubre con dinero libre de esa semana, sin tocar tus pagos ni tu colchón.';
  if(uncovered>0){if(uncovered<=cushion){lvl=1;why=`Te faltarían ${money(uncovered)} esa semana: tendrías que usar tu colchón o recortar pagos.`}else{lvl=2;why=`Te faltarían ${money(uncovered)} esa semana y tu colchón no alcanza.`}
    if(weeklyAvail()>0&&uncovered>s.redPct*weeklyAvail()){lvl=2;why=`La compra se come más del ${pct(s.redPct,0)} de lo que te entra por semana y no tienes dinero libre.`}}
  let cs=null;if(card&&mode!=='efectivo'){const st=cardStats(card);const after=st.limit?(st.used+amt)/st.limit:1;cs={st,after};
    if(amt>st.avail){lvl=2;why=`No te alcanza el crédito de ${card.name}: tienes ${money(st.avail)} disponibles.`}
    else if(after>=s.utilCrit){lvl=Math.max(lvl,2);why+=` Además ${card.name} quedaría al ${pct(after)} de uso.`}
    else if(after>=s.utilWarn){lvl=Math.max(lvl,1);why+=` ${card.name} quedaría al ${pct(after)} de uso (recomendado: menos de ${pct(s.utilWarn,0)}).`}}
  const g=cat(z.cat),personal=g&&g.group==='Variable';
  const m=stats(txIn(monthStart(z.date),monthEnd(z.date))).personal;
  return{amt,impact,outDate,w,libre,covered,uncovered,lvl,why,cs,months,mode,personal,m,mAfter:m+(personal?amt:0),card}}

function obHarvest(){const st=U.ob.step,root=document.querySelector('.ob-main');if(!root)return true;
  const fs=st===0?[{k:'name'}]:st===1?[SET_F[2],SET_F[1]]:st===2?SET_F.slice(3):null;
  if(fs){const{o}=readForm(root,fs,'o_');for(const k in o){if(o[k]!=null&&o[k]!=='')S.settings[k]=o[k];else if(['initialBalance','incomeAmount','extraMin','extraMax','dailyGoal','emergency'].includes(k))S.settings[k]=0}save();return true}
  if(st>=3&&st<=5&&root.querySelector('#obForm')){const k=['loan','card','sub'][st-3];const nm=root.querySelector('#n_name');if(nm&&nm.value.trim())return obAdd(k)}

function obAdd(k){const root=document.querySelector('#obForm');const fs=k==='loan'?LOAN_F:k==='card'?CARD_F:subF();const{o,errs}=readForm(root,fs,'n_');
  if(errs.length){const e=document.getElementById('obErr');if(e)e.textContent='Falta: '+errs.join(', ');return false}
  addEntity(k,o);render();return true}
function addEntity(k,o,id){
  if(k==='card'){const dayOf=v=>v?parse(v).getDate():null;const c={id:id||uid(),name:o.name,limit:+o.limit||0,balance:+o.balance||0,cutDay:dayOf(o.cutDate)||o.cutDay||1,dueDay:dayOf(o.dueDate)||o.dueDay||1,cutAnchor:o.cutDate||null,dueAnchor:o.dueDate||null,noInt:o.noInt,baseDate:today()};
    if(id){const old=S.cards.find(x=>x.id===id);const cur=Math.round(cardStats(old).used*100)/100;if(Math.abs(cur-c.balance)<0.005&&old.noInt==o.noInt){c.balance=old.balance;c.baseDate=old.baseDate}Object.assign(old,c)}else S.cards.push(c)}
  if(k==='loan'){const l={id:id||uid(),name:o.name,kind:o.kind,original:+o.original||0,payment:+o.payment||0,freq:o.freq,n:Math.max(1,Math.round(+o.n||1)),paidInit:Math.max(0,Math.round(+o.paidInit||0)),nextDate:o.nextDate||today(),capital:o.capital};
    if(id)Object.assign(S.loans.find(x=>x.id===id),l);else S.loans.push(l)}
  if(k==='sub'){const s={id:id||uid(),name:o.name,amount:+o.amount||0,day:o.day,method:o.method,cat:o.cat||'Suscripciones'};if(id)Object.assign(S.subs.find(x=>x.id===id),s);else S.subs.push(s)}
  save()}

function ensureCat(name,type,group){if(!cat(name))S.categories.push({name,type,group})}
function markPaid(x){const t=today();
  if(x.paid){if(x.kind==='loan'){const l=S.txs.filter(y=>y.target===x.ref&&y.loanKind!=='abono'&&groupOf(y)==='Deuda').sort((a,b)=>(b.ts||0)-(a.ts||0))[0];if(l)S.txs=S.txs.filter(y=>y!==l)}
    else{const p=S.paid[x.key];if(p)S.txs=S.txs.filter(y=>y.id!==p.txId);delete S.paid[x.key]}save();render();toast('Pago desmarcado');return}
  let tx={id:uid(),ts:Date.now(),date:t,type:'Gasto',amount:x.amount,method:'Débito'};
  if(x.kind==='card'){ensureCat('Pago de tarjetas','Gasto','Deuda');Object.assign(tx,{cat:'Pago de tarjetas',desc:'Pago '+x.name,target:x.ref})}
  else if(x.kind==='loan'){ensureCat('Pago de préstamo','Gasto','Deuda');const l=S.loans.find(l=>l.id===x.ref);Object.assign(tx,{cat:'Pago de préstamo',desc:'Cuota '+(l?l.name:''),target:x.ref,loanKind:'cuota'})}
  else if(x.kind==='sub'){const s=S.subs.find(s=>s.id===x.ref);Object.assign(tx,{cat:s.cat||'Suscripciones',desc:s.name,method:s.method,subId:s.id,date:x.date<t?x.date:t})}
  else{ensureCat('Ahorro / colchón','Gasto','Ahorro');Object.assign(tx,{cat:'Ahorro / colchón',desc:'Colchón de emergencia'})}
  S.txs.push(tx);if(x.kind!=='loan')S.paid[x.key]={txId:tx.id,amount:x.amount,date:x.date};save();render();toast('Pago registrado como movimiento')}

  catch(x){toast(src==='texto'?'Ese texto no es un respaldo válido. Revisa que lo hayas copiado completo.':'Ese archivo no es un respaldo válido de la libreta.')}}

const TE=new TextEncoder(), TD=new TextDecoder();
const b64=buf=>{const a=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ITER=210000;
async function pwKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter||ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesEnc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}}
async function aesDec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
async function gz(bytes){if(!window.CompressionStream)return[bytes,false];const s=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));return[new Uint8Array(await new Response(s).arrayBuffer()),true]}
async function ungz(bytes,flag){if(!flag)return bytes;const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function userHash(u){const h=await crypto.subtle.digest('SHA-256',TE.encode('libreta:'+u.trim().toLowerCase()));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40)}
const importDK=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);
const acctRef=h=>DB.doc('cuentas/'+h);
const recRef=h=>UID?DB.doc(`data/users/${UID}/rec_${h}`):null;
async function sealData(dk,obj){const[bytes,g]=await gz(TE.encode(JSON.stringify(obj)));return{data:await aesEnc(dk,bytes),gz:g}}
async function openData(dk,doc){return JSON.parse(TD.decode(await ungz(await aesDec(dk,doc.data),doc.gz)))}
async function wrapDK(pw,raw){const salt=crypto.getRandomValues(new Uint8Array(16));const k=await pwKey(pw,salt,ITER);return{salt:b64(salt),iter:ITER,wrap:await aesEnc(k,raw)}}
async function unwrapDK(pw,doc){const k=await pwKey(pw,unb64(doc.salt),doc.iter);return aesDec(k,doc.wrap)}

/* Liga (o adopta) una identidad de recuperación en Firebase Auth con correo+contraseña
   propios de la persona. No escribe nada en Firestore todavía; eso lo hace writeEscrow
   una vez que quien llama tiene el hash y la llave que quiere resguardar. */
async function linkRecoveryEmail(email,pw){
  const cred=firebase.auth.EmailAuthProvider.credential(email,pw);
  try{
    const cur=AUTH.currentUser;
    if(cur&&cur.isAnonymous){await cur.linkWithCredential(cred)}
    else{await AUTH.signInWithCredential(cred)}
  }catch(e){
    if(e&&(e.code==='auth/email-already-in-use'||e.code==='auth/credential-already-in-use')){
      await AUTH.signInWithEmailAndPassword(email,pw)
    }else if(e&&e.code==='auth/wrong-password'){throw new Error('Esa contraseña de recuperación no coincide con ese correo.')}
    else throw e
  }
  UID=AUTH.currentUser?AUTH.currentUser.uid:null}

     ${pwField('a_recPw','Contraseña de recuperación','new-password','Mínimo 6 caracteres. Puede ser distinta a tu contraseña de arriba.')}
     ${pwField('a_recPw2','Confírmala','new-password')}
     ${e}<div class="row" style="justify-content:flex-end"><button class="btn primary" type="submit"${busy?' disabled':''}>${busy?'Creando…':'Crear cuenta'}</button></div></form>${busyRow}
    <p class="small muted" style="margin-top:24px">¿Ya tienes cuenta? <button class="linkbtn" data-a="authMode" data-m="login">Entra aquí</button></p>`;
  else if(m==='recover')body=`<h1>Recupera tu contraseña</h1><p class="lead">Esto solo funciona si ya habías ligado un correo de recuperación a este usuario. Escribe tu usuario y el correo y contraseña de recuperación que ligaste.</p>
    <form class="form" id="authForm" style="max-width:440px;grid-template-columns:1fr" data-form="recover">
     ${field({k:'user',l:'Usuario',ph:'tu.usuario'},U.authUser||'','a_')}
     ${field({k:'email',l:'Correo de recuperación',t:'text',ph:'tu@correo.com'},U.authEmail||'','a_')}
     ${pwField('a_pw','Contraseña de recuperación','current-password')}
     ${e}<div class="row" style="justify-content:space-between"><button class="linkbtn" type="button" data-a="authMode" data-m="login">Volver a entrar</button><button class="btn primary" type="submit"${busy?' disabled':''}>${busy?'Buscando…':'Continuar'}</button></div></form>${busyRow}`;
  else if(m==='recover2')body=`<h1>Nueva contraseña</h1><p class="lead">Encontramos tu usuario <b>${esc(U.authUser)}</b>. Elige una contraseña nueva para tu libreta; tus datos se quedan igual.</p>
    <form class="form" id="authForm" style="max-width:440px;grid-template-columns:1fr" data-form="recover2">
     ${pwField('a_pw','Contraseña nueva','new-password','Mínimo 6 caracteres.')}
     ${pwField('a_pw2','Confírmala','new-password')}
     ${e}<div class="row" style="justify-content:space-between"><button class="linkbtn" type="button" data-a="authMode" data-m="login">Cancelar</button><button class="btn primary" type="submit"${busy?' disabled':''}>${busy?'Guardando…':'Guardar y entrar'}</button></div></form>${busyRow}`;
  const previewNote=(!DB&&U.authPreview)?`<p class="small muted" style="background:var(--surface2);padding:8px 12px;border-radius:8px;margin-bottom:14px">Vista previa: así se ve, pero las cuentas se activan cuando conectemos el servidor. <button class="linkbtn" data-a="authPreviewExit">Salir de la vista previa</button></p>`:'';
  return `<div class="ob">${side}<main class="ob-main enter" style="--dx:36px">${previewNote}${body}</main></div>`}
function bootHTML(){return `<div class="ob"><aside class="ob-side"><div class="brand"><span class="brand-mark">${icon('windmill')}</span><div><b>El Molino</b><span>finanzas personales</span></div></div></aside>
  <main class="ob-main"><h1>Abriendo tu libreta…</h1><p class="lead">Conectando con el servidor.</p>${sheepLoader(5)}${U.bootSlow?`<button class="btn" data-a="useLocal" style="margin-top:18px">Usar solo en este navegador</button>`:''}</main></div>`}

async function authSubmit(kind){
  if(!DB){U.authErr='Esto todavía es solo una vista previa: conecta el servidor para poder crear cuentas de verdad.';render();return}
  const f=document.getElementById('authForm'),v=id=>(f.querySelector('#'+id)||{}).value||'';
  const user=kind==='recover2'?U.authUser:v('a_user').trim(),pw=v('a_pw'),pw2=v('a_pw2'),email=v('a_email').trim();
  const recEmail=v('a_recEmail').trim(),recPw=v('a_recPw'),recPw2=v('a_recPw2');
  U.authUser=user;if(kind==='signup'){U.authOwner=v('a_owner').trim();U.authRecEmail=recEmail}if(kind==='recover')U.authEmail=email;
  const fail=(msg,focus)=>{U.authErr=msg;U.authBusy=false;render();const el=document.getElementById(focus||(kind==='recover2'?'a_pw':kind==='recover'?'a_email':'a_user'));if(el)el.focus()};
  if((kind==='login'||kind==='signup'||kind==='recover')&&!validUser(user))return fail(user?'Ese usuario no es válido. Usa de 3 a 30 letras, números, punto o guion.':'Escribe tu usuario.');
  if(kind==='login'&&!pw)return fail('Escribe tu contraseña.');
  if(kind==='recover'&&!validEmail(email))return fail('Escribe un correo válido.');
  if(kind==='recover'&&!pw)return fail('Escribe la contraseña de recuperación.');
  if((kind==='signup'||kind==='recover2')&&pw.length<6)return fail('La contraseña debe tener al menos 6 caracteres.');
  if((kind==='signup'||kind==='recover2')&&pw!==pw2)return fail('Las contraseñas no coinciden.');
  if(kind==='signup'&&!U.authOwner)return fail('Escribe el nombre del propietario.');
  if(kind==='signup'&&!validEmail(recEmail))return fail('Escribe un correo de recuperación válido: es obligatorio.','a_recEmail');
  if(kind==='signup'&&recPw.length<6)return fail('La contraseña de recuperación debe tener al menos 6 caracteres.','a_recPw');
  if(kind==='signup'&&recPw!==recPw2)return fail('Las contraseñas de recuperación no coinciden.','a_recPw2');
  U.authErr='';U.authBusy=true;render();
  try{const hash=await userHash(user),ref=acctRef(hash);
    if(kind==='signup'){const snap=await ref.get();if(snap.exists)return fail('Ese usuario ya existe. Elige otro.');
      try{await linkRecoveryEmail(recEmail,recPw)}catch(e){return fail(e&&e.message?e.message:'No se pudo preparar tu correo de recuperación. Revisa el correo y la contraseña.','a_recEmail')}
      const dk=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);const raw=new Uint8Array(await crypto.subtle.exportKey('raw',dk));
      const escrowOk=await writeEscrow(hash,b64(raw));if(!escrowOk)return fail('No se pudo guardar tu recuperación por correo. Inténtalo de nuevo.');
      let init=blank();try{const legacy=JSON.parse(localStorage.getItem(KEY)||'null');if(legacy&&legacy.setupDone&&!legacy.example)init=normalizeState(legacy)}catch(e){}
      ensureCoreCats(init);init.settings.name=U.authOwner;
      const t=Date.now(),doc={v:1,...await wrapDK(pw,raw),...await sealData(dk,init),device:DEVICE,created:t,updatedAt:t};
      await ref.set(doc);U.authBusy=false;await startAccount(user,hash,raw,dk,doc,{fresh:true});toast(init.setupDone?'Cuenta creada con los datos de este navegador':'Cuenta creada');return}
    if(kind==='login'){const snap=await ref.get();if(!snap.exists)return fail('Este usuario no existe.');const doc=snap.data();
      let raw;try{raw=await unwrapDK(pw,doc)}catch(e){return fail('La contraseña no es correcta.')}
      const dk=await importDK(raw);U.authBusy=false;await startAccount(user,hash,raw,dk,doc);toast('Bienvenido de vuelta');return}
    if(kind==='recover'){const snap=await ref.get();if(!snap.exists)return fail('Este usuario no existe.');
      let cred;try{cred=await AUTH.signInWithEmailAndPassword(email,pw)}catch(e){return fail('Ese correo y contraseña de recuperación no coinciden con ninguna cuenta ligada.')}
      UID=cred.user.uid;const r=recRef(hash);const rs=r?await r.get():null;
      if(!rs||!rs.exists)return fail('Ese correo no está ligado a este usuario. Recupéralo desde el correo con el que lo ligaste, o si nunca ligaste uno, no es posible recuperar la contraseña.');
      U.recRaw=rs.data().dk;U.authMode='recover2';U.auth='recover2';U.authBusy=false;U.authErr='';render();return}
    if(kind==='recover2'){const raw=unb64(U.recRaw),dk=await importDK(raw);const snap=await ref.get();if(!snap.exists)return fail('Este usuario ya no existe.');const doc=snap.data();
      try{await openData(dk,doc)}catch(e){return fail('No se pudo recuperar: la llave guardada ya no coincide con este usuario.')}
      const w=await wrapDK(pw,raw);await ref.update({...w});U.recRaw=null;U.authBusy=false;await startAccount(user,hash,raw,dk,{...doc,...w});toast('Contraseña cambiada');return}
  }catch(e){fail(e&&e.code==='permission-denied'?'No tienes permiso para guardar aquí. Revisa las reglas de seguridad de tu proyecto de Firebase.':'No pudimos conectar. Revisa tu conexión e inténtalo de nuevo.')}}
async function changePassword(){const g=id=>(document.getElementById(id)||{}).value||'',out=document.getElementById('pwMsg');
  const cur=g('cp_cur'),n1=g('cp_new'),n2=g('cp_new2');const say=(m,ok)=>{out.textContent=m;out.className=ok?'small pos':'err'};
  if(n1.length<6)return say('La contraseña nueva debe tener al menos 6 caracteres.');if(n1!==n2)return say('Las contraseñas nuevas no coinciden.');
  try{const snap=await acctRef(U.acct.hash).get();const doc=snap.data();try{await unwrapDK(cur,doc)}catch(e){return say('La contraseña actual no es correcta.')}
    await acctRef(U.acct.hash).update({...await wrapDK(n1,unb64(U.acct.raw))});['cp_cur','cp_new','cp_new2'].forEach(i=>{const el=document.getElementById(i);if(el)el.value=''});say('Contraseña cambiada.',true)}
  catch(e){say('No se pudo cambiar. Inténtalo de nuevo.')}}
function accountPanel(){if(!U.acct)return U.localMode?`<div class="panel"><div class="panel-head"><h2>Cuenta</h2></div><p class="muted" style="margin-bottom:12px">Estás usando la libreta sin cuenta: tus datos viven solo en este navegador.</p>${DB?`<button class="btn" data-a="leaveLocal">Crear cuenta o entrar</button>`:''}</div>`:'';
  return `<div class="panel"><div class="panel-head"><h2>Cuenta</h2><button class="btn sm" data-a="logout">Salir</button></div>
   <dl class="dl"><div><dt>Usuario</dt><dd>${esc(U.acct.user)}</dd></div><div><dt>Nombre del propietario</dt><dd>${esc(S.settings.name||'—')}</dd></div><div><dt>Estado</dt><dd>${esc(syncText())}</dd></div>
    <div><dt>Recuperación por correo</dt><dd>${U.acct.linked?`<span class="chip good">Ligada</span> <button class="btn sm ghost" data-a="linkRec">Cambiar correo</button>`:`<button class="btn sm" data-a="linkRec">Ligar correo de recuperación</button>`}</dd></div></dl>
   <h3 style="margin:18px 0 10px">Cambiar contraseña</h3><div class="form">
    ${pwField('cp_cur','Contraseña actual','current-password','La escribes tú: por seguridad, tu contraseña no se guarda en ningún lado, así que no podemos mostrártela. Usa el ojo para ver lo que tecleas.')}
    ${pwField('cp_new','Contraseña nueva','new-password')}
    ${pwField('cp_new2','Confírmala','new-password')}</div>
   <div class="row" style="margin-top:12px"><button class="btn" data-a="changePw">Cambiar contraseña</button><span id="pwMsg"></span></div>
   <p class="note" style="margin-top:14px">Si olvidas la contraseña de arriba, la recuperas con el correo que ligaste al crear tu cuenta. Esta computadora o celular recuerda tu sesión hasta que toques “Salir”.</p></div>`}

Object.assign(A,{
  authMode:b=>{U.auth=b.dataset.m;U.authErr='';render()},
  authPreview:()=>{U.authPreview=true;U.auth='login';U.authErr='';render()},
  authPreviewExit:()=>{U.authPreview=false;U.authErr='';render()},
  useLocal:()=>{U.booting=false;U.localMode=true;load();U.obDir=S.setupDone?0:1;render()},
  leaveLocal:()=>{U.localMode=false;U.auth='signup';render()},
  logout:()=>ask('¿Salir de tu cuenta?','Tus datos quedan guardados en tu cuenta. Para volver a verlos, entra con tu usuario y contraseña.',()=>{if(unsubAcct)unsubAcct();unsubAcct=null;
    try{localStorage.removeItem(KEY+':'+U.acct.hash)}catch(e){}clearSession();U.acct=null;S=blank();U.auth='login';U.authErr='';U.modal=null},'Salir',false),
  linkRec:()=>{U.modal={kind:'reclink',d:{}};render()},
  saveRecLink:()=>{saveRecLink()},
  changePw:()=>{changePassword()},
  togglePw:b=>{const inp=document.getElementById(b.dataset.target);if(!inp)return;const show=inp.type==='password';inp.type=show?'text':'password';
    b.setAttribute('aria-pressed',show?'true':'false');b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');b.innerHTML=icon(show?'eyeOff':'eye')},
});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='authForm'){e.preventDefault();if(!U.authBusy)authSubmit(f.dataset.form)}});

/* ---------- Inicio ---------- */
loadPrefs();applyTheme();
U.booting=true;render();
setTimeout(()=>{if(U.booting){U.bootSlow=true;render()}},4000);
(async()=>{
  if(!FIREBASE_READY||typeof firebase==='undefined'){DB=null;AUTH=null;if(!U.booting)return;U.booting=false;U.auth='login';render();return}
  try{
    const app=firebase.initializeApp(FIREBASE_CONFIG);
    DB=firebase.firestore();AUTH=firebase.auth();
    try{await AUTH.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
    if(!AUTH.currentUser)await AUTH.signInAnonymously();
    UID=AUTH.currentUser?AUTH.currentUser.uid:null;
  }catch(e){DB=null;AUTH=null;if(!U.booting)return;U.booting=false;U.auth='login';render();return}
  if(!U.booting)return;
  let sess=null;try{sess=JSON.parse(localStorage.getItem(SESSION)||'null')}catch(e){}
  if(DB&&sess&&sess.hash&&sess.raw){try{const snap=await acctRef(sess.hash).get();if(snap.exists){const raw=unb64(sess.raw);const dk=await importDK(raw);U.booting=false;await startAccount(sess.user,sess.hash,raw,dk,snap.data());return}clearSession()}catch(e){U.booting=true;U.authUser=sess.user}}
  if(!U.booting)return;
  U.booting=false;U.auth='login';render();
})();
})();
